<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake — кроссплатформенная ретро-игра</title>
<style>
  body { margin: 0; background: #111; color: #aaa; font-family: monospace;
         display: flex; flex-direction: column; align-items: center; }
  h1 { color: #ff5; font-size: 20px; margin: 12px 0 8px; letter-spacing: 4px; }
  canvas { max-width: 100vw; height: auto; image-rendering: pixelated;
           border: 2px solid #333; touch-action: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; margin: 12px; }
  .pad button { height: 56px; font-size: 24px; background: #222; color: #5f5;
                border: 1px solid #444; border-radius: 8px; }
  .pad button:active { background: #353; }
  .pad .enter { grid-column: 1 / span 3; font-size: 16px; color: #ff5; }
  p { font-size: 13px; margin: 4px; }
</style>
</head>
<body>
<h1>S N A K E</h1>
<canvas id="screen"></canvas>
<div class="pad">
  <span></span><button onclick="snakeKey(1)">&#9650;</button><span></span>
  <button onclick="snakeKey(3)">&#9664;</button><button onclick="snakeKey(2)">&#9660;</button><button onclick="snakeKey(4)">&#9654;</button>
  <button class="enter" onclick="snakeKey(5)">ENTER — старт</button>
</div>
<p>Клавиатура: стрелки / WASD, Enter. Телефон: кнопки или свайпы по полю.</p>
<p>C + Lua, скомпилировано в WebAssembly (Emscripten).</p>

{{{ SCRIPT }}}
</body>
</html>
